name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Arka arkaya iki push'ta eskisi iptal edilir; yalnız son hâlin kapısı önemli.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Consistency gate — self-test first, then line budgets, profile overlap, rule-name references, README figures
        run: bash scripts/check-consistency.sh --self-test && bash scripts/check-consistency.sh
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # research/2026-07/ holds raw machine-generated artifacts — not doc-standard material
          globs: |
            **/*.md
            !research/2026-07/**

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: lychee link check
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-progress --max-concurrency 4 --max-retries 3 --retry-wait-time 5 --accept '200..=299,429' --exclude-path research/2026-07 "**/*.md"
          fail: true
