name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Arka arkaya iki push'ta eskisi iptal edilir; yalnız son hâlin kapısı önemli.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Line budget — rules.md hard limit 130
        run: |
          lines=$(wc -l < rules.md)
          echo "rules.md: ${lines} lines (target ~110, hard limit 130)"
          [ "${lines}" -le 130 ]
      - name: Profile delta — supplement must not restate rules.md
        run: |
          python3 - <<'PY'
          import re, sys
          def shingles(path, n=7):
              words = re.sub(r'[^a-z0-9 ]', ' ', open(path).read().lower()).split()
              return {' '.join(words[i:i+n]) for i in range(len(words) - n + 1)}
          overlap = shingles('rules.md') & shingles('references/portable-supplement.md')
          print(f"shared 7-grams: {len(overlap)}")
          for s in sorted(overlap):
              print("  ", s)
          sys.exit(1 if len(overlap) > 2 else 0)
          PY
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # research/2026-07/ holds raw machine-generated artifacts — not doc-standard material
          globs: |
            **/*.md
            !research/2026-07/**

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: lychee link check
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-progress --max-concurrency 4 --max-retries 3 --retry-wait-time 5 --accept '200..=299,429' --exclude-path research/2026-07 "**/*.md"
          fail: true
